version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: couplefit_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-couplefit_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-couplefit_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-couplefit_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U couplefit_user -d couplefit_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: couplefit_fastapi
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://couplefit_user:couplefit_secret_pass@db:5432/couplefit_db
      JWT_SECRET: ${JWT_SECRET:-couplefit_dev_jwt_secret_change_in_production_32bytes}
      PORT: 8000
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: couplefit_web
    restart: always
    depends_on:
      - api
    environment:
      PORT: 3000
      VITE_API_URL: http://localhost:8000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
